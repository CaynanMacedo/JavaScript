    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caynanzito Pizzita</title>
</head>
<body>
    
    <h1>Caynanzito Pizzita</h1>
    <p>Voce tem 💲<strong id="textoDinheiro">0</strong></p>
    
    <img src="https://www.desenhar.org/wp-content/uploads/2022/11/Desenhar-Pizza-passo9.jpg" width="100" onclick="venderPizzas()"> 

    <hr/>

    <ul>
        <li>Carrinho de pizzas - 💲 <strong id="custoCarrinho">25</strong> <button onclick="carrinhoPizza()">COMPRAR</button> </li>
        <li>Forno - 💲 1.000 <button>COMPRAR</button> </li>
        <li>Marca Gourmet - 💲 50.000 <button>COMPRAR</button> </li>
    </ul>

    <p> entre com uma conta para ganhar 💲 1.000 <button onclick="resgatarRecompensa()">resgatar recompensa</button> </p>

    <script>

        let dinheiro = 0;
        let dinheiro_click = 1;
        let custo_carrinho = 25;

        function resgatarRecompensa(){
            if (localStorage.getItem("autenticado") == 1) {
                alert("Recompensa Concedida");
                dinheiro += 1000;
                document.getElementById("textoDinheiro").innerHTML = dinheiro;
            } else {
                alert("Voce deve fazer login para pegar a recompensa");
            }

            localStorage.setItem("recompensa",2)

            if (localStorage.getItem("recompensa") == 2) {
                alert("Recompensa ja foi concedida")
            }

        }

        function venderPizzas(){
            dinheiro += dinheiro_click;
            document.getElementById("textoDinheiro").innerHTML = dinheiro;
        }

        function carrinhoPizza(){
            if (dinheiro < custo_carrinho) {
                alert("Dinheiro insuficiente");
            } else {
                dinheiro_click += 1;
                dinheiro -= custo_carrinho;
                document.getElementById("textoDinheiro").innerHTML = dinheiro;
                custo_carrinho += parseInt(custo_carrinho * 0.2);
                document.getElementById("custoCarrinho").innerHTML = custo_carrinho;
            }
        }

    </script>

</body>
</html>

</body>
